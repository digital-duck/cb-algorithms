domain: Algorithms_JeffE
primitives:
  recursion:
    defines: A problem-solving technique where a function calls itself on smaller subproblems, with a
      base case terminating the recursive descent.
    tier: 0
  recursion_tree:
    defines: The tree of recursive subproblem calls generated by a recursive algorithm, where nodes are
      subproblems and edges are recursive calls.
    tier: 0
  subsequence:
    defines: A sequence obtained from another sequence by deleting zero or more elements without changing
      the order of the remaining elements.
    tier: 0
  binary_search_tree:
    defines: A tree data structure storing sorted keys such that search cost is proportional to a node's
      number of ancestors, assumed as prior knowledge in this chapter.
    tier: 0
concepts:
  backtracking:
    defines: A recursive strategy that incrementally builds a solution one component at a time, trying
      every alternative at each decision point and recursively exploring each before choosing.
    composed_of:
    - recursion
    tier: 1
  state_summary_minimization:
    defines: The design principle that each recursive call should carry only the smallest sufficient summary
      of past decisions needed to make future ones, rather than the full decision history.
    composed_of:
    - recursion
    tier: 1
  index_formulation:
    defines: Reformulating a recursive algorithm to operate on array indices into a global input array
      rather than passing copied subarrays, to avoid costly copying overhead.
    composed_of:
    - recursion
    tier: 1
  subtraction_recurrence_trick:
    defines: A method for solving summation-form recurrences by subtracting the recurrence for T(n-1)
      from T(n) to eliminate the summation and obtain a simple linear recurrence.
    composed_of:
    - recursion
    tier: 1
  game_tree:
    defines: A tree of game states connected by legal moves, used to represent all possible plays of a
      finite two-player game with no hidden information or randomness.
    composed_of:
    - recursion_tree
    tier: 1
  brute_force_enumeration:
    defines: The practice of trying every possible choice at each decision point rather than attempting
      to cleverly prune "obviously" bad options, deferring optimization until correctness is established.
    composed_of:
    - backtracking
    tier: 2
  exponential_running_time:
    defines: The observation that most backtracking algorithms explore an exponential number of partial
      solutions in the worst case, since they enumerate large sets of possibilities.
    composed_of:
    - backtracking
    tier: 2
  include_exclude_recursion:
    defines: A recursive pattern that decides, for each input element in turn, whether to include or exclude
      it from the solution, then recurses on the remaining elements.
    composed_of:
    - backtracking
    tier: 2
  divide_and_conquer_root_choice:
    defines: A recursive strategy that tries every possible choice of root/split point, partitioning the
      remaining problem into independent left and right subproblems solved by recursion.
    composed_of:
    - backtracking
    tier: 2
  good_bad_state:
    defines: A recursive classification of game states, where a state is good if the current player can
      move to a bad state for the opponent, and bad if every move leads to a good state for the opponent.
    composed_of:
    - game_tree
    tier: 2
applications:
  n_queens:
    defines: The problem of placing n queens on an n×n chessboard so that no two queens share a row, column,
      or diagonal, solved by backtracking one row at a time.
    needs:
    - backtracking
    - recursion_tree
    tier: 2
  game_tree_search:
    defines: A backtracking algorithm (depth-first search of the game tree) that determines whether a
      given game state is good or bad and finds winning moves.
    needs:
    - game_tree
    - good_bad_state
    tier: 3
  subset_sum:
    defines: The problem of determining whether some subset of a given set of integers sums to a target
      value T, solved by recursively including or excluding each element.
    needs:
    - include_exclude_recursion
    - exponential_running_time
    tier: 3
  text_segmentation:
    defines: The problem of splitting an unpunctuated string of characters into a sequence of valid words
      using a given IsWord test, solved by recursively choosing the next word boundary.
    needs:
    - brute_force_enumeration
    - index_formulation
    - subtraction_recurrence_trick
    - exponential_running_time
    tier: 3
  longest_increasing_subsequence:
    defines: The problem of finding the longest subsequence of an integer array whose elements appear
      in increasing order, solved by two alternative backtracking formulations (deciding per input element,
      or extending from the last chosen element).
    needs:
    - include_exclude_recursion
    - subsequence
    - state_summary_minimization
    - index_formulation
    - exponential_running_time
    tier: 3
  optimal_binary_search_tree:
    defines: The problem of building a binary search tree over keys with given access frequencies that
      minimizes total weighted search cost, solved by recursively choosing the root and recursing on left/right
      key ranges.
    needs:
    - binary_search_tree
    - divide_and_conquer_root_choice
    - subtraction_recurrence_trick
    - exponential_running_time
    tier: 3
